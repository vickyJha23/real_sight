    <meta name="theme-color" content="#ffffff" />
    <!-- Apply the saved theme (or the OS setting) before first paint, so dark mode never flashes white. -->
    <script>
      (function () {
        var t
        try {
          t = localStorage.getItem('theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#0b0f1a' : '#ffffff'
      })()
    </script>
